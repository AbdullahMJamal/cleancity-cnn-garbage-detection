<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CleanCity{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/leaf.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens (design/municipal_utility_interface/DESIGN.md) ───────── */
    :root{
      --canvas:#FAFAF9; --surface:#FFFFFF; --hover:#F5F5F4; --active:#EFEFEF; --selected:#F0F4F2;
      --border:#E5E5E3; --border-strong:#D4D4D1; --divider:#F0F0EE;
      --text:#1C1F1D; --muted:#6B706C; --disabled:#9CA09D;
      --accent:#1F5C3F; --accent-hover:#174630;
      --crit:#B3261E;  --crit-bg:#FDF2F2;  --crit-line:#F8B4B4;
      --warn:#B26A00;  --warn-bg:#FFF8E1;  --warn-line:#FFE082;
      --ok:#2E7D4F;    --ok-bg:#EDF7ED;    --ok-line:#A5D6A7;
      --idle:#6B706C;  --idle-bg:#F4F4F3;  --idle-line:#E0E0DE;
      --prog:#784600;  --prog-bg:#FBF3E9;  --prog-line:#E9CFA8;
      --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
      --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--canvas)}
    body{font:400 14px/20px var(--sans);color:var(--text);min-height:100vh;display:flex;flex-direction:column;
         -webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit;color:inherit}
    a{color:var(--accent)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .mono{font-family:var(--mono);font-size:12px;line-height:16px;letter-spacing:-.02em}
    .num{font-variant-numeric:tabular-nums lining-nums}
    .label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .muted{color:var(--muted)}
    .hidden{display:none!important}
    svg.i{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    svg.i.sm{width:14px;height:14px}

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
    .header-in{max-width:{% block maxw %}1200px{% endblock %};margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
    .brand-mark{width:32px;height:32px;border-radius:6px;background:#EDF4F0;border:1px solid #D5E6DC;display:grid;place-items:center}
    .brand-mark img{width:18px;height:18px}
    .brand-name{font-size:15px;font-weight:600;letter-spacing:-.005em}
    .brand-sep{width:1px;height:16px;background:var(--border-strong)}
    .brand-chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#404943;
                background:#F3F4F0;border:1px solid #C0C9C0;border-radius:4px;padding:1px 6px}
    .nav{display:flex;align-items:stretch;height:56px;gap:16px}
    .nav a,.nav button{display:inline-flex;align-items:center;padding:0 4px;border:none;background:none;cursor:pointer;
       border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-size:14px}
    .nav a:hover,.nav button:hover{color:var(--text)}
    .nav a.active{border-bottom-color:var(--accent);color:var(--text);font-weight:600}
    .nav form{display:flex}

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    main{flex:1;width:100%}
    .page{max-width:{{ self.maxw() }};margin:0 auto;padding:24px 16px}
    .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
    .lede{color:var(--muted);margin-top:4px}
    .rule{height:1px;background:var(--border);margin:16px 0 24px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:6px}
    .footer{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;text-align:center;color:var(--muted)}

    /* ── Buttons ────────────────────────────────────────────────────────────── */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;
         font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--border);
         background:var(--surface);color:var(--text);transition:background .12s,border-color .12s;white-space:nowrap}
    .btn:hover{background:var(--hover)}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
    .btn-primary:disabled{background:#9DB5A8;border-color:#9DB5A8;cursor:not-allowed}
    .btn-danger{color:var(--crit);border-color:var(--crit-line)}
    .btn-danger:hover{background:var(--crit-bg)}
    .btn-lg{height:40px;font-size:14px;font-weight:600;width:100%}
    .btn-micro{height:26px;padding:0 8px;font-size:12px}
    .link{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
          background:none;border:none;cursor:pointer;font-size:13px}
    .link:hover{text-decoration:underline}

    /* ── Chips & dots ───────────────────────────────────────────────────────── */
    .chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;
          border:1px solid var(--idle-line);background:var(--idle-bg);color:var(--idle);white-space:nowrap}
    .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .chip.nodot::before{display:none}
    .chip.crit,.chip.High{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}
    .chip.warn,.chip.Medium,.chip.pending{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
    .chip.ok,.chip.Low,.chip.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
    .chip.in_progress{background:var(--prog-bg);border-color:var(--prog-line);color:var(--prog)}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--idle);flex-shrink:0}
    .dot.High{background:var(--crit)} .dot.Medium{background:var(--warn)} .dot.Low{background:var(--ok)}
    .dot.pending{background:var(--warn)} .dot.in_progress{background:var(--prog)} .dot.done{background:var(--ok)}
    .dot.live{background:var(--ok)}

    /* ── Confidence meter ───────────────────────────────────────────────────── */
    .meter{width:96px;height:6px;background:#E1E3DF;border-radius:99px;overflow:hidden;display:inline-block}
    .meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
    .meter.weak>span{background:var(--warn)}

    /* ── Notices ────────────────────────────────────────────────────────────── */
    .notice{border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:8px 12px;font-size:13px;
            display:flex;align-items:center;gap:8px;margin-bottom:16px}
    .notice.ok{background:var(--ok-bg);border-color:var(--ok-line);color:#1E5A37}
    .notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#6F4300}
    .notice.err{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}

    @media(max-width:640px){
      .brand-chip,.brand-sep{display:none}
      h1{font-size:20px;line-height:28px}
      .page{padding:16px 12px}
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
<header class="header">
  <div class="header-in">
    <a class="brand" href="{{ url_for('user_home') }}">
      <span class="brand-mark"><img src="{{ url_for('static', filename='img/leaf.svg') }}" alt=""></span>
      <span class="brand-name">CleanCity</span>
      <span class="brand-sep"></span>
      <span class="brand-chip">Karachi Division</span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('user_home') }}" class="{% block nav_report %}{% endblock %}">Report</a>
      <a href="{{ url_for('team_dashboard') }}" class="{% block nav_ops %}{% endblock %}">Operations</a>
      {% if logged_in %}
      <form method="POST" action="{{ url_for('team_logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" title="Log out">Log out</button>
      </form>
      {% endif %}
    </nav>
  </div>
</header>

<main>{% block body %}{% endblock %}</main>

<footer class="footer mono">Sir Syed University of Engineering &amp; Technology, student project.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
